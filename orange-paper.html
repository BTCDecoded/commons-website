<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:;">
    <title>The Orange Paper: Bitcoin Protocol Specification - Bitcoin Commons</title>
    <meta name="description" content="Complete mathematical specification of the Bitcoin consensus protocol. The definitive reference for Bitcoin's consensus rules, state transitions, and economic model.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="The Orange Paper: Bitcoin Protocol Specification">
    <meta property="og:description" content="Complete mathematical specification of the Bitcoin consensus protocol">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://thebitcoincommons.org/orange-paper.html">
    <meta property="og:image" content="https://thebitcoincommons.org/assets/og-image.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Orange Paper: Bitcoin Protocol Specification">
    <meta name="twitter:description" content="Complete mathematical specification of the Bitcoin consensus protocol">
    <meta name="twitter:image" content="https://thebitcoincommons.org/assets/og-image.png">
    
    <link rel="stylesheet" href="style.css?v=3">
    
    <!-- MathJax for LaTeX rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    <!-- Mermaid for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ 
            startOnLoad: false, // We'll call run() manually after content loads
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { useMaxWidth: true, htmlLabels: true },
            sequence: { useMaxWidth: true }
        });
    </script>
    
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    
    <style>
        /* Orange Paper specific styles */
        .orange-paper-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.8;
        }
        
        .orange-paper-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--border-color, #333);
        }
        
        .orange-paper-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color, #f7931a);
        }
        
        .orange-paper-header h2 {
            font-size: 1.5rem;
            color: var(--text-secondary, #aaa);
            font-weight: normal;
        }
        
        .orange-paper-meta {
            margin-top: 1rem;
            color: var(--text-secondary, #aaa);
            font-size: 0.9rem;
        }
        
        .orange-paper-content {
            font-size: 1.1rem;
        }
        
        /* Math rendering */
        .orange-paper-content .MathJax {
            font-size: 1.1em;
        }
        
        /* Mermaid diagrams */
        .orange-paper-content .mermaid {
            margin: 2rem auto;
            text-align: center;
            background: var(--bg-secondary, #1a1a1a);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        
        /* Code blocks */
        .orange-paper-content pre {
            background: var(--bg-secondary, #1a1a1a);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid var(--border-color, #333);
        }
        
        .orange-paper-content code {
            background: var(--bg-secondary, #1a1a1a);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .orange-paper-content pre code {
            background: transparent;
            padding: 0;
        }
        
        /* Headings */
        .orange-paper-content h1,
        .orange-paper-content h2,
        .orange-paper-content h3,
        .orange-paper-content h4 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-color, #f7931a);
        }
        
        .orange-paper-content h1 {
            font-size: 2rem;
            border-bottom: 2px solid var(--border-color, #333);
            padding-bottom: 0.5rem;
        }
        
        .orange-paper-content h2 {
            font-size: 1.75rem;
        }
        
        .orange-paper-content h3 {
            font-size: 1.5rem;
        }
        
        .orange-paper-content h4 {
            font-size: 1.25rem;
        }
        
        /* Tables */
        .orange-paper-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }
        
        .orange-paper-content table th,
        .orange-paper-content table td {
            padding: 0.75rem;
            border: 1px solid var(--border-color, #333);
            text-align: left;
        }
        
        .orange-paper-content table th {
            background: var(--bg-secondary, #1a1a1a);
            font-weight: bold;
        }
        
        /* Links */
        .orange-paper-content a {
            color: var(--primary-color, #f7931a);
            text-decoration: none;
        }
        
        .orange-paper-content a:hover {
            text-decoration: underline;
        }
        
        /* Lists */
        .orange-paper-content ul,
        .orange-paper-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }
        
        .orange-paper-content li {
            margin: 0.5rem 0;
        }
        
        /* Blockquotes */
        .orange-paper-content blockquote {
            border-left: 4px solid var(--primary-color, #f7931a);
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            color: var(--text-secondary, #aaa);
            font-style: italic;
        }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary, #aaa);
        }
        
        /* Error state */
        .error {
            text-align: center;
            padding: 3rem;
            color: #ff4444;
        }
        
        /* Navigation */
        .orange-paper-nav {
            position: sticky;
            top: 0;
            background: var(--bg-primary, #000);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color, #333);
            z-index: 100;
            margin-bottom: 2rem;
        }
        
        .orange-paper-nav a {
            color: var(--primary-color, #f7931a);
            text-decoration: none;
            margin-right: 1.5rem;
        }
        
        .orange-paper-nav a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .orange-paper-container {
                padding: 1rem;
            }
            
            .orange-paper-header h1 {
                font-size: 2rem;
            }
            
            .orange-paper-content {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="orange-paper-nav">
        <div class="container">
            <a href="index.html">← Back to Home</a>
            <a href="#top">Top</a>
            <a href="https://github.com/BTCDecoded/blvm-spec" target="_blank">View on GitHub</a>
        </div>
    </div>
    
    <div class="orange-paper-container" id="top">
        <div class="orange-paper-header">
            <h1>The Orange Paper</h1>
            <h2>Bitcoin Protocol Specification</h2>
            <div class="orange-paper-meta">
                <p><strong>Version 1.0</strong></p>
                <p>Based on Bitcoin Core Implementation Analysis</p>
                <p>Authors: BTCDecoded.org, MyBitcoinFuture.com, @secsovereign</p>
            </div>
        </div>
        
        <div id="loading" class="loading">
            Loading Orange Paper...
        </div>
        
        <div id="error" class="error" style="display: none;">
            Error loading Orange Paper. Please try again later.
        </div>
        
        <div id="content" class="orange-paper-content" style="display: none;"></div>
    </div>
    
    <script>
        // Load and render the Orange Paper
        async function loadOrangePaper() {
            try {
                // Fetch the markdown file from the blvm-spec repository
                // Using raw GitHub content URL
                const response = await fetch('https://raw.githubusercontent.com/BTCDecoded/blvm-spec/main/THE_ORANGE_PAPER.md');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdown = await response.text();
                
                // Configure marked
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    headerIds: true,
                    mangle: false
                });
                
                // Convert markdown to HTML
                let html = marked.parse(markdown);
                
                // Process mermaid code blocks - handle both ```mermaid and ``` mermaid formats
                html = html.replace(/```\s*mermaid\s*\n([\s\S]*?)```/g, (match, diagram) => {
                    return `<div class="mermaid">${diagram.trim()}</div>`;
                });
                
                // Display content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = html;
                document.getElementById('content').style.display = 'block';
                
                // Initialize Mermaid after content is loaded
                if (typeof mermaid !== 'undefined') {
                    // Wait for DOM to settle, then render all mermaid diagrams
                    setTimeout(() => {
                        const mermaidElements = document.querySelectorAll('.mermaid');
                        if (mermaidElements.length > 0) {
                            // Mermaid 10 API: run() renders all elements matching the querySelector
                            mermaid.run({
                                querySelector: '.mermaid'
                            }).catch(err => {
                                console.error('Mermaid rendering error:', err);
                            });
                        }
                    }, 500); // Increased timeout to ensure DOM is fully settled
                }
                
                // Render MathJax - wait for it to be ready
                if (window.MathJax) {
                    MathJax.startup.promise.then(() => {
                        return MathJax.typesetPromise();
                    }).catch(function (err) {
                        console.error('MathJax rendering error:', err);
                    });
                } else {
                    // MathJax might still be loading, wait for it
                    const checkMathJax = setInterval(() => {
                        if (window.MathJax && window.MathJax.startup) {
                            clearInterval(checkMathJax);
                            MathJax.startup.promise.then(() => {
                                return MathJax.typesetPromise();
                            }).catch(function (err) {
                                console.error('MathJax rendering error:', err);
                            });
                        }
                    }, 100);
                    
                    // Stop checking after 10 seconds
                    setTimeout(() => clearInterval(checkMathJax), 10000);
                }
                
            } catch (error) {
                console.error('Error loading Orange Paper:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }
        
        // Load when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadOrangePaper);
        } else {
            loadOrangePaper();
        }
    </script>
</body>
</html>
