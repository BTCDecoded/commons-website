# Build static tree and publish to GitHub Pages (repository root).

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [blvm-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Static build only needs node and rsync; the self-hosted rust runners stay busy and leave it queued.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: BTCDecoded/blvm-spec
          path: _blvm-spec
          ref: main

      - uses: actions/checkout@v6
        with:
          repository: BTCDecoded/governance
          path: _governance
          ref: main

      - uses: actions/checkout@v6
        with:
          repository: BTCDecoded/blvm-spec-lock
          path: _blvm-spec-lock
          ref: main

      - uses: actions/checkout@v6
        with:
          repository: BTCDecoded/blvm-consensus
          path: _blvm-consensus
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sync blvm-spec markdown for site viewers
        run: BLVM_SPEC_DIR=_blvm-spec node scripts/sync-blvm-spec-markdown.mjs

      - name: Sync governance assets for site viewers
        run: GOVERNANCE_DIR=_governance node scripts/sync-governance-assets.mjs

      - name: Build verification evidence from spec-lock and consensus
        run: BLVM_SPEC_LOCK_DIR=_blvm-spec-lock BLVM_CONSENSUS_DIR=_blvm-consensus node scripts/build-verification-evidence.mjs

      - name: Render ecosystem page from data/implementations.json
        run: node scripts/render-ecosystem.mjs

      - name: Reject public status phrases that have no evidence link
        run: node scripts/check-public-claims.mjs

      - name: Refresh BLVM release metadata (badge + assets/blvm-release.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-blvm-release-meta.mjs

      - name: Stage site (exclude .git and tooling)
        run: |
          mkdir -p ./_site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '_blvm-spec' \
            --exclude '_governance' \
            --exclude '_blvm-spec-lock' \
            --exclude '_blvm-consensus' \
            --exclude 'node_modules' \
            ./ ./_site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Publish does not need the rust runners. Those stay busy with CI and leave this job queued.
    runs-on: ubuntu-latest

    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
