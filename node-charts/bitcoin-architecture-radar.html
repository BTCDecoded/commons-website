<!DOCTYPE html>
<html lang="en" class="arch-radar-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Architecture quality radar</title>
  <script src="../assets/vendor/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121418;
      --border: #2a3140;
      --muted: #94a3b8;
      --text: #e8eaef;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px 16px 20px;
    }
    .chart-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .chart-wrap {
      position: relative;
      width: 100%;
      height: min(72vh, 640px);
      min-height: 360px;
    }
    .sr-context {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="sr-context">
      Radar chart comparing illustrative architecture quality scores for Core
      versus Commons on eight axes from zero to one hundred.
    </p>
    <div class="chart-shell" role="img" aria-label="Radar chart: Core versus Commons architecture quality">
      <div class="chart-wrap">
        <canvas id="architectureChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var grid = "rgba(148, 163, 184, 0.18)";

      var ctx = document.getElementById("architectureChart").getContext("2d");
      /* Same dataset as node-comparison/bitcoin-architecture-comparison.html */
      new Chart(ctx, {
        type: "radar",
        data: {
          labels: [
            "Code Maintainability",
            "Governance Clarity",
            "Economic Sustainability",
            "Security Verification",
            "Distributed Control",
            "Consensus Safety",
            "Implementation Diversity",
            "Long-term Viability",
          ],
          datasets: [
            {
              label: "Core",
              data: [20, 15, 10, 25, 20, 30, 5, 15],
              backgroundColor: "rgba(96, 165, 250, 0.22)",
              borderColor: "rgba(147, 197, 253, 1)",
              borderWidth: 2,
              pointBackgroundColor: "rgba(147, 197, 253, 1)",
              pointBorderColor: "#0f172a",
              pointHoverBackgroundColor: "#e2e8f0",
              pointHoverBorderColor: "rgba(147, 197, 253, 1)",
            },
            {
              label: "Commons",
              data: [90, 95, 85, 95, 90, 95, 85, 90],
              backgroundColor: "rgba(247, 147, 26, 0.2)",
              borderColor: "rgba(251, 191, 36, 1)",
              borderWidth: 2,
              pointBackgroundColor: "rgba(251, 191, 36, 1)",
              pointBorderColor: "#0f172a",
              pointHoverBackgroundColor: "#fef3c7",
              pointHoverBorderColor: "rgba(251, 191, 36, 1)",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: "Architecture quality (illustrative 0–100)",
              color: "#f1f5f9",
              font: { size: 15, weight: "600" },
              padding: { bottom: 8 },
            },
            legend: {
              position: "bottom",
              labels: {
                color: "#cbd5e1",
                font: { size: 13 },
                padding: 16,
                usePointStyle: true,
              },
            },
          },
          scales: {
            r: {
              beginAtZero: true,
              max: 100,
              ticks: {
                stepSize: 20,
                color: "#94a3b8",
                backdropColor: "rgba(15, 17, 20, 0.92)",
                showLabelBackdrop: true,
              },
              grid: { color: grid },
              angleLines: { color: grid },
              pointLabels: {
                color: "#e2e8f0",
                font: { size: 11 },
              },
            },
          },
        },
      });

      function reportEmbedHeight() {
        try {
          if (window.parent === window) return;
          var el = document.querySelector(".page");
          if (!el) return;
          var h = Math.ceil(el.getBoundingClientRect().bottom);
          window.parent.postMessage(
            { type: "btcc-arch-radar-height", height: h },
            "*"
          );
        } catch (e) {}
      }

      window.addEventListener("load", function () {
        setTimeout(reportEmbedHeight, 80);
      });
      window.addEventListener("resize", function () {
        setTimeout(reportEmbedHeight, 50);
      });
    })();
  </script>
</body>
</html>
