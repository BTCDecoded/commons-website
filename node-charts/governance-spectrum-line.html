<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Governance spectrum</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121418;
      --border: #2a3140;
      --muted: #94a3b8;
      --text: #e8eaef;
      --axis: #4b5563;
      --marker: #cbd5e1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 10px 10px;
    }
    .chart-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 12px 14px;
    }
    .axis {
      height: 4px;
      background: var(--axis);
      border-radius: 2px;
      margin: 28px 0 58px;
      position: relative;
    }
    .marker {
      position: absolute;
      top: -10px;
      width: 2px;
      height: 24px;
      background: var(--marker);
      border-radius: 1px;
    }
    .label {
      position: absolute;
      top: 22px;
      transform: translateX(-50%);
      font-size: 12px;
      text-align: center;
      line-height: 1.25;
      background: rgba(24, 28, 32, 0.92);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      max-width: 140px;
    }
    .label .note {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }
    .label .note.note-nowrap {
      white-space: nowrap;
    }
    .zone-left {
      position: absolute;
      left: 0;
      top: -14px;
      height: 32px;
      width: 25%;
      background: linear-gradient(90deg, rgba(185, 28, 28, 0.35), rgba(185, 28, 28, 0.06));
      border-radius: 4px 0 0 4px;
    }
    .zone-right {
      position: absolute;
      right: 0;
      top: -14px;
      height: 32px;
      width: 25%;
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.06), rgba(107, 114, 128, 0.28));
      border-radius: 0 4px 4px 0;
    }
    .zone-opt {
      position: absolute;
      left: 66%;
      transform: translateX(-50%);
      top: -18px;
      height: 40px;
      width: 24%;
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), rgba(5, 150, 105, 0.22));
      border-radius: 8px;
    }
    .zone-opt-title {
      position: absolute;
      left: 66%;
      transform: translateX(-50%);
      top: -36px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #6ee7b7;
      text-align: center;
      white-space: nowrap;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div
    class="page"
    role="img"
    aria-label="Governance spectrum from centralized to decentralized: Bank, Bitcoin now, Modular, Chaos. Green band marks the preferred modular region."
  >
    <div class="chart-shell">
      <div class="axis" aria-hidden="true">
        <div class="zone-left"></div>
        <div class="zone-right"></div>
        <div class="zone-opt-title">Bitcoin Commons</div>
        <div class="zone-opt"></div>
        <div class="marker" style="left: 10%"></div>
        <div class="label" style="left: 10%">
          Bank<span class="note">Single authority</span>
        </div>
        <div class="marker" style="left: 40%"></div>
        <div class="label" style="left: 40%">
          Bitcoin now<span class="note">Informal oligarchy</span>
        </div>
        <div class="marker" style="left: 66%"></div>
        <div class="label" style="left: 66%">
          Modular<span class="note">Distributed governance</span>
        </div>
        <div class="marker" style="left: 90%"></div>
        <div class="label" style="left: 90%">
          Chaos<span class="note note-nowrap">No rules</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      function reportHeight() {
        var el = document.querySelector(".page");
        var h = el
          ? el.getBoundingClientRect().height
          : document.body.offsetHeight;
        if (window.parent !== window) {
          window.parent.postMessage(
            { type: "btcc-gov-spectrum-height", height: h },
            "*"
          );
        }
      }
      window.addEventListener("load", reportHeight);
      window.addEventListener("resize", reportHeight);
      if (document.readyState === "complete") reportHeight();
    })();
  </script>
</body>
</html>
