<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Orange Paper Viewer - Local Test</title>
    <link rel="stylesheet" href="style.css?v=3">
    
    <!-- MathJax for LaTeX rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    <!-- Mermaid for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { useMaxWidth: true, htmlLabels: true },
            sequence: { useMaxWidth: true }
        });
    </script>
    
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    
    <style>
        /* Same styles as orange-paper.html */
        .orange-paper-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.8;
        }
        
        .orange-paper-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--border-color, #333);
        }
        
        .orange-paper-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color, #f7931a);
        }
        
        .orange-paper-content {
            font-size: 1.1rem;
        }
        
        .orange-paper-content .mermaid {
            margin: 2rem auto;
            text-align: center;
            background: var(--bg-secondary, #1a1a1a);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        
        .orange-paper-content pre {
            background: var(--bg-secondary, #1a1a1a);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid var(--border-color, #333);
        }
        
        .orange-paper-content code {
            background: var(--bg-secondary, #1a1a1a);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary, #aaa);
        }
        
        .error {
            text-align: center;
            padding: 3rem;
            color: #ff4444;
        }
        
        .file-input-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--bg-secondary, #1a1a1a);
            border-radius: 8px;
            border: 1px solid var(--border-color, #333);
        }
        
        .file-input-section h3 {
            margin-bottom: 1rem;
            color: var(--primary-color, #f7931a);
        }
        
        .file-input-section input[type="file"] {
            margin: 1rem 0;
            padding: 0.5rem;
            border: 1px solid var(--border-color, #333);
            border-radius: 4px;
            background: var(--bg-primary, #000);
            color: var(--text-primary, #fff);
        }
        
        .file-input-section button {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color, #f7931a);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .file-input-section button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="orange-paper-container">
        <div class="orange-paper-header">
            <h1>The Orange Paper</h1>
            <h2>Bitcoin Protocol Specification</h2>
            <p><strong>Local Test Mode</strong></p>
        </div>
        
        <div class="file-input-section">
            <h3>Load Orange Paper</h3>
            <p>Choose how to load the Orange Paper:</p>
            <div style="margin: 1rem 0;">
                <label>
                    <input type="radio" name="source" value="github" checked>
                    From GitHub (requires internet)
                </label>
            </div>
            <div style="margin: 1rem 0;">
                <label>
                    <input type="radio" name="source" value="local">
                    From local file:
                    <input type="file" id="fileInput" accept=".md" style="margin-left: 1rem;">
                </label>
            </div>
            <button onclick="loadPaper()">Load Orange Paper</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            Loading Orange Paper...
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="content" class="orange-paper-content" style="display: none;"></div>
    </div>
    
    <script>
        async function loadPaper() {
            const source = document.querySelector('input[name="source"]:checked').value;
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const contentEl = document.getElementById('content');
            
            // Hide previous content
            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            contentEl.style.display = 'none';
            errorEl.textContent = '';
            
            try {
                let markdown;
                
                if (source === 'github') {
                    // Fetch from GitHub
                    const response = await fetch('/assets/spec/THE_ORANGE_PAPER.md');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    markdown = await response.text();
                } else {
                    // Load from local file
                    const fileInput = document.getElementById('fileInput');
                    const file = fileInput.files[0];
                    if (!file) {
                        throw new Error('Please select a file');
                    }
                    markdown = await file.text();
                }
                
                // Configure marked
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    headerIds: true,
                    mangle: false
                });
                
                // Convert markdown to HTML
                let html = marked.parse(markdown);
                
                // Process mermaid code blocks
                html = html.replace(/```\s*mermaid\s*\n([\s\S]*?)```/g, (match, diagram) => {
                    return `<div class="mermaid">${diagram.trim()}</div>`;
                });
                
                // Display content
                loadingEl.style.display = 'none';
                contentEl.innerHTML = html;
                contentEl.style.display = 'block';
                
                // Initialize Mermaid after content is loaded
                if (typeof mermaid !== 'undefined') {
                    setTimeout(() => {
                        const mermaidElements = document.querySelectorAll('.mermaid');
                        if (mermaidElements.length > 0) {
                            mermaid.run({
                                querySelector: '.mermaid'
                            }).catch(err => {
                                console.error('Mermaid rendering error:', err);
                            });
                        }
                    }, 200);
                }
                
                // Render MathJax
                if (window.MathJax) {
                    MathJax.startup.promise.then(() => {
                        return MathJax.typesetPromise();
                    }).catch(function (err) {
                        console.error('MathJax rendering error:', err);
                    });
                } else {
                    const checkMathJax = setInterval(() => {
                        if (window.MathJax && window.MathJax.startup) {
                            clearInterval(checkMathJax);
                            MathJax.startup.promise.then(() => {
                                return MathJax.typesetPromise();
                            }).catch(function (err) {
                                console.error('MathJax rendering error:', err);
                            });
                        }
                    }, 100);
                    setTimeout(() => clearInterval(checkMathJax), 10000);
                }
                
            } catch (error) {
                console.error('Error loading Orange Paper:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = `Error: ${error.message}`;
            }
        }
        
        // Auto-load from GitHub on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Optionally auto-load, or wait for user to click button
            // loadPaper();
        });
    </script>
</body>
</html>
